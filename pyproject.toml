[project]
name = "apex-fusion-agent-sdk"
version = "0.2.0"
description = "Python Agent SDK for Vector blockchain - PyCardano + Ogmios"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "dcejtlin-apex", email = "david.cejtlin@hal8.io" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pycardano>=0.19.2,<0.20",
    # pycardano 0.19.2 fails on import with cbor2 6.x (cbor2pure imports CBORDecodeValueError).
    "cbor2>=5.6,<6",
    "pynacl>=1.5",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    # mcp 2.x removed streamablehttp_client, which VectorAgentMCP uses.
    "mcp>=1.0.0,<2",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://apex-fusion.github.io/vector-ai-documentation/"
Documentation = "https://apex-fusion.github.io/vector-ai-documentation/sdk/python/"
Repository = "https://github.com/Apex-Fusion/agent-sdk-py"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.17.3,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vector_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Modules from before 0.2.0 keep their broad exception fallbacks and casts;
# the identity package is held to the full default rule set.
"src/vector_agent/{agent,agent_mcp}.py" = ["BLE001", "S110", "RUF046"]
"src/vector_agent/chain/*.py" = ["BLE001", "FURB162"]
"src/vector_agent/governance/*.py" = ["BLE001", "S110", "FURB162", "RUF012", "RUF013", "PERF102"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.17.3,<0.18",
]
